<!DOCTYPE html>
<html>
<head>
    <title>Capitalize First Letter</title>
</head>
<body>

    <h2>Capitalize First Letter of Each Word</h2>

    <input type="text" id="text" placeholder="Enter a sentence">
    <button onclick="capitalizeWords()">Convert</button>

    <h3 id="result"></h3>

    <script>
        function capitalizeWords() {
            let str = document.getElementById("text").value;

            let result = str.replace(/\b\w/g, function(letter) {
                return letter.toUpperCase();
            });

            document.getElementById("result").innerHTML =
                "Converted String: " + result;
        }
    </script>

</body>
</html>
