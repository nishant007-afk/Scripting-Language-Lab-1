<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest of Three Numbers</title>
</head>
<body>

    <h2>Find Largest and Smallest Number</h2>

    <input type="number" id="num1" placeholder="Enter First Integer"><br><br>

    <input type="number" id="num2" placeholder="Enter Second Integer"><br><br>

    <input type="number" id="num3" placeholder="Enter Third Integer"><br><br>

    <button onclick="compareNumbers()">Compare</button>

    <h3 id="result"></h3>

    <script>
        function compareNumbers() {
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let num3 = Number(document.getElementById("num3").value);

            let largest = Math.max(num1, num2, num3);
            let smallest = Math.min(num1, num2, num3);

            document.getElementById("result").innerHTML =
                "Largest Number: " + largest + "<br>" +
                "Smallest Number: " + smallest;
        }
    </script>

</body>
</html>
