<!DOCTYPE html>
<html>
<head>
    <title>Sort String Alphabetically</title>
</head>
<body>

    <h2>Sort String Alphabetically</h2>

    <input type="text" id="text" placeholder="Enter a string">
    <button onclick="sortString()">Sort</button>

    <h3 id="result"></h3>

    <script>
        function sortString() {
            let str = document.getElementById("text").value;

            let sorted = str.split('').sort().join('');

            document.getElementById("result").innerHTML =
                "Sorted String: " + sorted;
        }
    </script>

</body>
</html>
