<!DOCTYPE html>
<html>
<head>
    <title>Days Until Christmas</title>
</head>
<body>

    <h2>Days Left Until Christmas</h2>

    <button onclick="daysUntilChristmas()">Calculate</button>

    <h3 id="result"></h3>

    <script>
        function daysUntilChristmas() {
            let today = new Date();
            let christmas = new Date(today.getFullYear(), 11, 25);

            if (today > christmas) {
                christmas.setFullYear(today.getFullYear() + 1);
            }

            let difference = christmas - today;
            let days = Math.ceil(difference / (1000 * 60 * 60 * 24));

            document.getElementById("result").innerHTML =
                "Days Left Until Christmas: " + days;
        }
    </script>

</body>
</html>
